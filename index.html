<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shopping Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --badge-bg: #f8fafc;
            
            --cat-fresh: #dcfce7; --cat-fresh-txt: #15803d;
            --cat-use: #fef3c7; --cat-use-txt: #b45309;
            --cat-drink: #e0e7ff; --cat-drink-txt: #3730a3;
            --cat-other: #f1f5f9; --cat-other-txt: #475569;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --badge-bg: #0f172a;

            --cat-fresh: #14532d; --cat-fresh-txt: #86efac;
            --cat-use: #78350f; --cat-use-txt: #fde047;
            --cat-drink: #312e81; --cat-drink-txt: #a5b4fc;
            --cat-other: #334155; --cat-other-txt: #cbd5e1;
        }

        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; transition: background 0.2s, color 0.2s, border-color 0.2s; }
        body { background: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }

        .app-container { background: var(--bg-card); width: 100%; max-width: 720px; border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border); height: fit-content; }
        
        /* Header & Stats */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; margin: 0; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .theme-btn { background: var(--bg-body); border: 1px solid var(--border); color: var(--text-main); padding: 8px 12px; border-radius: 10px; cursor: pointer; }

        .progress-box { background: var(--bg-body); padding: 16px; border-radius: 12px; margin-bottom: 20px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .progress-bg { background: var(--border); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s; }

        /* Responsive Form Layout */
        .input-form { display: grid; grid-template-columns: 2fr 1.2fr 1fr 1fr auto; gap: 8px; margin-bottom: 20px; }
        
        input, select { background: var(--bg-body); border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; border-radius: 10px; font-size: 14px; outline: none; width: 100%; }
        input:focus, select:focus { border-color: var(--primary); }
        
        .add-btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .add-btn:hover { background: var(--primary-hover); }

        /* Mobile Responsive adjustment */
        @media (max-width: 640px) {
            .input-form { grid-template-columns: 1fr 1fr; }
            .input-form input[type="text"] { grid-column: span 2; }
            .add-btn { grid-column: span 2; }
            .app-container { padding: 16px; }
        }

        /* Filters & Actions */
        .controls-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
        .filter-btn { background: var(--bg-body); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Item List */
        .item-list { list-style: none; padding: 0; margin: 0; max-height: 400px; overflow-y: auto; }
        .item-card { display: flex; align-items: center; justify-content: space-between; background: var(--bg-body); padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; border: 1px solid transparent; }
        .item-card:hover { border-color: var(--border); }
        .item-card.completed { opacity: 0.5; }
        .item-card.completed .item-name { text-decoration: line-through; }

        .item-left { display: flex; align-items: center; gap: 10px; }
        .checkbox { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
        .item-details { display: flex; flex-direction: column; }
        .item-name { font-weight: 600; font-size: 14px; }
        .item-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; margin-top: 2px; }

        .badge { padding: 1px 6px; border-radius: 4px; font-weight: 600; font-size: 10px; }
        .cat-อาหารสด { background: var(--cat-fresh); color: var(--cat-fresh-txt); }
        .cat-ของใช้ { background: var(--cat-use); color: var(--cat-use-txt); }
        .cat-เครื่องดื่ม { background: var(--cat-drink); color: var(--cat-drink-txt); }
        .cat-อื่นๆ { background: var(--cat-other); color: var(--cat-other-txt); }

        .item-right { display: flex; align-items: center; gap: 12px; }
        .price-tag { font-weight: 700; font-size: 14px; color: var(--primary); }
        .del-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; opacity: 0.6; }
        .del-btn:hover { opacity: 1; }

        /* Summary & Utility Footer */
        .footer-summary { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
        .total-amount { font-size: 18px; font-weight: 700; color: var(--primary); }

        .tools-bar { display: flex; gap: 8px; margin-top: 12px; }
        .tool-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; flex: 1; }
        .tool-btn:hover { background: var(--bg-body); color: var(--text-main); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>🛒 Smart Cart Pro</h1>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
    </div>

    <div class="progress-box">
        <div class="progress-info">
            <span>ความคืบหน้าการซื้อ</span>
            <span id="progressTxt">0%</span>
        </div>
        <div class="progress-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- Form ปรับโครงสร้างแบบ Grid Dynamic -->
    <div class="input-form">
        <input type="text" id="nameIn" placeholder="ชื่อสินค้า..." />
        <select id="catIn">
            <option value="อาหารสด">🥬 อาหารสด</option>
            <option value="ของใช้">🧼 ของใช้</option>
            <option value="เครื่องดื่ม">🧃 เครื่องดื่ม</option>
            <option value="อื่นๆ">📦 อื่นๆ</option>
        </select>
        <input type="number" id="qtyIn" value="1" min="1" placeholder="จำนวน" />
        <input type="number" id="priceIn" placeholder="ราคา/ชิ้น" min="0" />
        <button class="add-btn" onclick="addItem()">+ เพิ่ม</button>
    </div>

    <div class="controls-row">
        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('ทั้งหมด', this)">ทั้งหมด</button>
            <button class="filter-btn" onclick="setFilter('อาหารสด', this)">🥬 อาหารสด</button>
            <button class="filter-btn" onclick="setFilter('ของใช้', this)">🧼 ของใช้</button>
            <button class="filter-btn" onclick="setFilter('เครื่องดื่ม', this)">🧃 เครื่องดื่ม</button>
            <button class="filter-btn" onclick="setFilter('อื่นๆ', this)">📦 อื่นๆ</button>
        </div>
    </div>

    <ul class="item-list" id="itemList"></ul>

    <div class="footer-summary">
        <span>ยอดรวมประมาณ:</span>
        <span class="total-amount" id="totalPrice">฿0</span>
    </div>

    <div class="tools-bar">
        <button class="tool-btn" onclick="clearCompleted()">🧹 ลบรายการที่ซื้อแล้ว</button>
        <button class="tool-btn" onclick="exportData()">📥 ข้อมูลสำรอง (Export)</button>
        <button class="tool-btn" onclick="clearAll()">🗑️ ลบทั้งหมด</button>
    </div>
</div>

<script>
    let items = JSON.parse(localStorage.getItem('cart_items')) || [];
    let activeCategory = 'ทั้งหมด';

    document.addEventListener("DOMContentLoaded", () => {
        render();
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            document.getElementById('themeBtn').innerText = '☀️ Light';
        }
    });

    function addItem() {
        const name = document.getElementById('nameIn').value.trim();
        const category = document.getElementById('catIn').value;
        const qty = parseInt(document.getElementById('qtyIn').value) || 1;
        const price = parseFloat(document.getElementById('priceIn').value) || 0;

        if (!name) return;

        items.push({ id: Date.now(), name, category, qty, price, completed: false });
        saveAndRender();

        document.getElementById('nameIn').value = '';
        document.getElementById('priceIn').value = '';
        document.getElementById('qtyIn').value = 1;
    }

    function toggleCheck(id) {
        items = items.map(item => item.id === id ? { ...item, completed: !item.completed } : item);
        saveAndRender();
    }

    function deleteItem(id) {
        items = items.filter(item => item.id !== id);
        saveAndRender();
    }

    function setFilter(cat, btn) {
        activeCategory = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function clearCompleted() {
        items = items.filter(item => !item.completed);
        saveAndRender();
    }

    function clearAll() {
        if (confirm("ต้องการลบรายการทั้งหมดใช่หรือไม่?")) {
            items = [];
            saveAndRender();
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", "shopping_list.json");
        dlAnchor.click();
    }

    function toggleTheme() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.body.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            document.getElementById('themeBtn').innerText = '🌙 Dark';
        } else {
            document.body.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            document.getElementById('themeBtn').innerText = '☀️ Light';
        }
    }

    function saveAndRender() {
        localStorage.setItem('cart_items', JSON.stringify(items));
        render();
    }

    function render() {
        const list = document.getElementById('itemList');
        list.innerHTML = '';

        const filtered = items.filter(i => activeCategory === 'ทั้งหมด' || i.category === activeCategory);

        filtered.forEach(item => {
            const li = document.createElement('li');
            li.className = `item-card ${item.completed ? 'completed' : ''}`;
            li.innerHTML = `
                <div class="item-left">
                    <input type="checkbox" class="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleCheck(${item.id})">
                    <div class="item-details">
                        <span class="item-name">${escapeHtml(item.name)}</span>
                        <div class="item-meta">
                            <span class="badge cat-${item.category}">${item.category}</span>
                            <span>x${item.qty} (${item.price}฿/ชิ้น)</span>
                        </div>
                    </div>
                </div>
                <div class="item-right">
                    <span class="price-tag">฿${(item.qty * item.price).toLocaleString()}</span>
                    <button class="del-btn" onclick="deleteItem(${item.id})">✕</button>
                </div>
            `;
            list.appendChild(li);
        });

        const total = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
        document.getElementById('totalPrice').innerText = `฿${total.toLocaleString()}`;

        const doneCount = items.filter(i => i.completed).length;
        const pct = items.length ? Math.round((doneCount / items.length) * 100) : 0;
        document.getElementById('progressFill').style.width = `${pct}%`;
        document.getElementById('progressTxt').innerText = `${pct}%`;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
